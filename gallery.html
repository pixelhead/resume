<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Gabe Torrez — work gallery. Illustration, 3D, motion, and print.">
<title>Gabe Torrez — Work Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C0C0E; --bg-2:#141418; --ink:#F4F2ED; --ink-2:#9B988F;
  --line:#26262B; --accent:#D6FF3E;
  --pad:clamp(14px,3.5vw,40px);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
button{font-family:inherit}

/* page title banner */
.pagetitle{max-width:1440px;margin:0 auto;padding:clamp(2rem,5vw,3.5rem) var(--pad) clamp(1rem,2vw,1.5rem)}
.pagetitle h1{font-family:'Anton',sans-serif;text-transform:uppercase;letter-spacing:.01em;
  line-height:.9;font-size:clamp(2.8rem,9vw,6rem)}
.pagetitle h1 span{color:var(--accent)}
.pagetitle p{color:var(--ink-2);font-size:1rem;font-weight:500;margin-top:.8rem;max-width:48ch}

/* top bar */
.bar{position:sticky;top:0;z-index:50;background:rgba(12,12,14,.9);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:.9rem var(--pad)}
.bar-in{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap}
.logo{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:1.15rem;letter-spacing:.02em;
  white-space:nowrap}
.logo span{color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:.5rem;margin-left:auto}
.filter{font-weight:700;font-size:.8rem;padding:.5rem 1rem;border-radius:100px;
  border:1px solid var(--line);color:var(--ink-2);background:transparent;cursor:pointer;transition:.2s}
.filter:hover{color:var(--ink);border-color:#3a3a42}
.filter.active{background:var(--accent);color:#0C0C0E;border-color:var(--accent)}
.filter.home{background:var(--accent);color:#0C0C0E;border-color:var(--accent);text-decoration:none;
  display:inline-flex;align-items:center;margin-left:2.45rem}
.filter.home:hover{color:#0C0C0E;transform:translateY(-1px)}
.bar-link{font-weight:700;font-size:.8rem;color:var(--ink-2);transition:color .2s;text-decoration:none;white-space:nowrap}
.bar-link:hover{color:var(--ink)}

/* GALLERY — CSS grid with explicit tier spans (dense flow fills gaps) */
.gallery{max-width:1440px;margin:0 auto;padding:clamp(1rem,3vw,1.8rem) var(--pad) 4rem;
  display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;grid-auto-rows:220px;grid-auto-flow:dense}
.gitem{border-radius:14px;overflow:hidden;position:relative;cursor:pointer;
  background:var(--bg-2);border:1px solid var(--line);
  transition:transform .25s,border-color .25s}
.gitem:hover{transform:translateY(-4px);border-color:#3a3a42}
.gitem img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.gitem:hover img{transform:scale(1.05)}

/* size tiers — only apply in the "All" view (body.filtered strips them) */
.gitem.hero{grid-column:span 2;grid-row:span 2}
.gitem.feat{grid-column:span 2;grid-row:span 1}
.gitem.tall{grid-column:span 1;grid-row:span 2}
/* std = 1x1 default */

/* when a medium filter is active, everything snaps to uniform 1x1 */
body.filtered .gitem{grid-column:span 1 !important;grid-row:span 1 !important}

.gitem .ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;
  padding:1rem 1.1rem;background:linear-gradient(to top,rgba(12,12,14,.94) 8%,rgba(12,12,14,.08) 55%,transparent);
  opacity:0;transition:opacity .25s}
.gitem:hover .ov{opacity:1}
.gitem .ov .t{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.gitem .ov h4{font-size:1rem;font-weight:700;margin-top:.15rem}
.gitem.hero .ov h4{font-size:1.5rem}
.gitem.feat .ov h4{font-size:1.2rem}
.gitem .ov .desc{color:var(--ink-2);font-size:.82rem;margin-top:.35rem;max-width:42ch;display:none}
/* description only shows on the big tiles, and only in All view */
.gitem.hero .ov .desc,.gitem.feat .ov .desc{display:block}
body.filtered .gitem .ov .desc{display:none}
body.filtered .gitem.hero .ov h4,body.filtered .gitem.feat .ov h4{font-size:1rem}

.gitem .badge{position:absolute;top:.7rem;right:.7rem;width:36px;height:36px;border-radius:50%;
  background:rgba(12,12,14,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;
  font-size:.95rem;opacity:0;transition:opacity .25s;border:1px solid rgba(255,255,255,.18);z-index:2}
.gitem:hover .badge{opacity:1}
.gitem.hide{display:none}
.empty{color:var(--ink-2);text-align:center;padding:4rem 0;font-size:.95rem}

/* lightbox */
.lb{position:fixed;inset:0;z-index:100;background:rgba(8,8,10,.95);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:clamp(1rem,4vw,3rem)}
.lb.open{display:flex}
.lb-inner{max-width:1100px;max-height:90vh;position:relative;display:flex;flex-direction:column;align-items:center}
.lb-inner img,.lb-inner video{max-width:100%;max-height:80vh;border-radius:10px;display:block;background:#000}
.lb-cap{margin-top:1rem;text-align:center}
.lb-cap .t{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.lb-cap h4{font-size:1.1rem;font-weight:700;margin-top:.2rem}
.lb-close{position:absolute;top:-2.6rem;right:0;background:none;border:0;color:var(--ink);
  font-size:1.6rem;cursor:pointer;line-height:1;padding:.3rem}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.08);
  border:1px solid var(--line);color:var(--ink);width:48px;height:48px;border-radius:50%;cursor:pointer;
  font-size:1.3rem;display:flex;align-items:center;justify-content:center;transition:.2s}
.lb-nav:hover{background:var(--accent);color:#0C0C0E;border-color:var(--accent)}
.lb-prev{left:-1rem}.lb-next{right:-1rem}

@media(max-width:1000px){
  .gallery{grid-template-columns:repeat(2,1fr)}
  .gitem.hero{grid-column:span 2;grid-row:span 2}
  .gitem.feat{grid-column:span 2;grid-row:span 1}
  .gitem.tall{grid-column:span 1;grid-row:span 2}
}
@media(max-width:560px){
  .gallery{grid-template-columns:1fr;grid-auto-rows:200px}
  .gitem.hero,.gitem.feat,.gitem.tall{grid-column:span 1;grid-row:span 1}
  .lb-prev{left:.3rem}.lb-next{right:.3rem}.lb-close{top:-2.4rem}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="pagetitle">
  <h1>Work <span>Gallery</span></h1>
  <p>Illustration, 3D, motion, and print. Filter to explore, tap any piece to open it.</p>
</div>

<header class="bar">
  <div class="bar-in">
    <a class="filter home" href="index.html">← Home</a>
    <div class="filters" id="filters">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="motion">Motion</button>
      <button class="filter" data-filter="illustration">Illustration</button>
      <button class="filter" data-filter="3d">3D</button>
      <button class="filter" data-filter="interactive">Interactive</button>
      <button class="filter" data-filter="apparel">Apparel</button>
      <button class="filter" data-filter="print">Print</button>
    </div>
    <a class="bar-link" href="index.html">About / Résumé →</a>
  </div>
</header>

<main class="gallery" id="gallery"></main>

<div class="lb" id="lb">
  <div class="lb-inner">
    <button class="lb-close" id="lbClose" aria-label="Close">✕</button>
    <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous">‹</button>
    <button class="lb-nav lb-next" id="lbNext" aria-label="Next">›</button>
    <div id="lbMedia"></div>
    <div class="lb-cap"><span class="t" id="lbTag"></span><h4 id="lbTitle"></h4></div>
  </div>
</div>

<script>
/* ---------------------------------------------------------------
   PROJECT LIST
   tier: 'hero' (2x2) | 'feat' (2x1) | 'tall' (1x2) | 'std' (1x1)
   desc: shown only on hero/feat tiles, in the "All" view
   To add your 10 new items: copy any line below, drop in the new
   img / title / tag / cat, and set a tier. That's it.
---------------------------------------------------------------- */
const PROJECTS=[
  {img:'img/Employee_Appreciation_final.jpg', src:'video/Employee_Appreciation_final.mp4', title:'Employee Appreciation', tag:'Premiere · Audition', cat:'motion', type:'video', tier:'hero', desc:'Video piece celebrating the team — editing, sound design, and motion.'},
  {img:'img/mock_1.jpg',        title:'Concept illustration I',   tag:'Photoshop · Procreate', cat:'illustration', type:'image', tier:'std'},
  {img:'img/mock_2.jpg',        title:'Concept illustration II',  tag:'Photoshop · Procreate', cat:'illustration', type:'image', tier:'tall'},
  {img:'img/Alice.jpg',         src:'video/alice_web.mp4',        title:'Alice',                tag:'Unity3D App',           cat:'motion',       type:'video', tier:'feat', desc:'Interactive Unity3D application — real-time motion and UI.'},
  {img:'img/mock_4.jpg',        title:'Concept illustration III', tag:'Photoshop · Procreate', cat:'illustration', type:'image', tier:'std'},
  {img:'img/bloodknight.jpg',   title:'Blood Knight',             tag:'Photoshop · Procreate', cat:'illustration', type:'image', tier:'tall'},
  {img:'img/Gallery.jpg',       link:'https://employeeanniversarygallery.s3.amazonaws.com/AG2020/index.html', title:'Anniversary Gallery', tag:'Unity3D Gallery', cat:'interactive', type:'link', tier:'feat', desc:'Interactive 3D anniversary gallery, shipped to the web.'},
  {img:'img/nec.jpg',           title:'Character study',          tag:'Photoshop · Procreate', cat:'illustration', type:'image', tier:'std'},
  {img:'img/mcclintock_band_tee.jpg', title:'McClintock HS Band Tees', tag:'Photoshop', cat:'apparel', type:'image', tier:'feat', desc:'Apparel design for the McClintock High School band, shown on garment.'},
  {img:'img/ai_learning_tools.jpg', src:'video/ai_learning_tools.mp4', title:'AI Learning Tools', tag:'Premiere · AI tools', cat:'motion', type:'video', tier:'std'},
  {img:'img/spider.jpg',        title:'Spider sculpt',            tag:'ZBrush · Photoshop',    cat:'3d',           type:'image', tier:'std'},
  {img:'img/uopx_payment.jpg',  link:'#', title:'UOPX Training: Payment', tag:'Storyline · Photoshop', cat:'interactive', type:'link', tier:'std'},
  {img:'img/uopx_military.jpg', link:'#', title:'UOPX Training: Military Culture', tag:'Storyline · Photoshop', cat:'interactive', type:'link', tier:'std'},
  {img:'img/HollowKnight1.jpg', title:'Hollow Knight I',          tag:'ZBrush · Photoshop',    cat:'3d',           type:'image', tier:'tall'},
  {img:'img/11-GAndR-1_beta.jpg', src:'video/11-GAndR-1Beta_final.mp4', title:'G&R Animation', tag:'Animate · Illustrator', cat:'motion', type:'video', tier:'feat', desc:'Character animation built in Animate from Illustrator artwork.'},
  {img:'img/HollowKnight2.jpg', title:'Hollow Knight II',         tag:'ZBrush',                cat:'3d',           type:'image', tier:'std'},
  {img:'img/AndrewJohnson.jpg', src:'video/17_Andrew Johnson_twitter.mp4', title:'Andrew Johnson', tag:'Photoshop · Spine 2D', cat:'motion', type:'video', tier:'std'},
  {img:'img/wizard.jpg',        title:'Wizard',                   tag:'Photoshop · Procreate', cat:'illustration', type:'image', tier:'std'},
  {img:'img/Crest_large.jpg',   title:'Crest',                    tag:'ZBrush',                cat:'3d',           type:'image', tier:'tall'},
  {img:'img/WoodrowWilson.jpg', src:'video/28_Woodrow_Wilson_twitter.mp4', title:'Woodrow Wilson', tag:'Photoshop · Spine 2D', cat:'motion', type:'video', tier:'std'},
  {img:'img/animation_ai.jpg',  src:'video/animation_ai.mp4', title:'Animation', tag:'AI tools', cat:'motion', type:'video', tier:'std'},
  {img:'img/uopx_omva.jpg',     link:'#', title:'UOPX Training: OMVA', tag:'Storyline · Photoshop', cat:'interactive', type:'link', tier:'std'},
  {img:'img/tugboat.jpg',       src:'video/tugboat.mp4', title:'Animation: Tug Boat', tag:'Spine 2D', cat:'motion', type:'video', tier:'tall'},
  {img:'img/uopx_disburse.jpg', link:'#', title:'UOPX Training: Ready to Disburse', tag:'Storyline · Photoshop', cat:'interactive', type:'link', tier:'std'},
  {img:'img/Rouge.jpg',         title:'Rouge',                    tag:'Photoshop · Procreate', cat:'illustration', type:'image', tier:'std'},
  {img:'img/MM.ja.jpg',         link:'img/MM.ja.pdf',             title:'Editorial layout',     tag:'InDesign',              cat:'print',        type:'link', tier:'feat', desc:'Multi-page editorial composition and layout in InDesign.'},
  {img:'img/unseen.jpg',        title:'Unseen',                   tag:'Photoshop',             cat:'illustration', type:'image', tier:'std'},
  {img:'img/003Honeycomb.jpg',  link:'https://sketchfab.com/3d-models/003-honeycomb-4bddba892c114120ae0941d0c2cf0c52', title:'Honeycomb', tag:'3ds Max · Sketchfab', cat:'interactive', type:'link', tier:'std'},
  {img:'img/Accreditation.jpg', link:'extra_web/UOPX_Accreditation/story_html5.html', title:'UOPX Accreditation', tag:'Storyline 360 · Audition', cat:'interactive', type:'link', tier:'std'}
];

const gallery=document.getElementById('gallery');
const badgeFor=t=>t==='video'?'▶':t==='link'?'↗':'⤢';
gallery.innerHTML=PROJECTS.map((p,i)=>`
  <div class="gitem ${p.tier||'std'}" data-cat="${p.cat}" data-i="${i}">
    <img src="${p.img}" alt="${p.title}" loading="lazy">
    <span class="badge">${badgeFor(p.type)}</span>
    <div class="ov">
      <span class="t">${p.tag}</span>
      <h4>${p.title}</h4>
      ${p.desc?`<p class="desc">${p.desc}</p>`:''}
    </div>
  </div>`).join('');

document.getElementById('filters').addEventListener('click',e=>{
  const b=e.target.closest('.filter');if(!b||!b.dataset.filter)return;
  document.querySelectorAll('.filter').forEach(f=>f.classList.remove('active'));
  b.classList.add('active');
  const f=b.dataset.filter;
  // Option A: size hierarchy only in "All". Any medium filter → uniform grid.
  document.body.classList.toggle('filtered',f!=='all');
  document.querySelectorAll('.gitem').forEach(g=>g.classList.toggle('hide',f!=='all'&&g.dataset.cat!==f));
});

const lb=document.getElementById('lb'),lbMedia=document.getElementById('lbMedia'),
  lbTag=document.getElementById('lbTag'),lbTitle=document.getElementById('lbTitle');
let curList=[],curIdx=0;
function openLB(i){
  const p=PROJECTS[i];
  if(p.type==='link'){window.open(p.link,'_blank','noopener');return;}
  curList=PROJECTS.map((x,idx)=>({x,idx})).filter(o=>{
    const el=document.querySelector('.gitem[data-i="'+o.idx+'"]');
    return o.x.type!=='link' && el && !el.classList.contains('hide');
  });
  curIdx=curList.findIndex(o=>o.idx===i);
  renderLB();lb.classList.add('open');document.body.style.overflow='hidden';
}
function renderLB(){
  const p=curList[curIdx].x;
  lbMedia.innerHTML=p.type==='video'
    ? `<video src="${p.src}" controls autoplay playsinline></video>`
    : `<img src="${p.img}" alt="${p.title}">`;
  lbTag.textContent=p.tag;lbTitle.textContent=p.title;
}
function closeLB(){lb.classList.remove('open');lbMedia.innerHTML='';document.body.style.overflow=''}
function step(d){if(!curList.length)return;curIdx=(curIdx+d+curList.length)%curList.length;renderLB()}
gallery.addEventListener('click',e=>{const g=e.target.closest('.gitem');if(g)openLB(+g.dataset.i)});
document.getElementById('lbClose').onclick=closeLB;
document.getElementById('lbPrev').onclick=e=>{e.stopPropagation();step(-1)};
document.getElementById('lbNext').onclick=e=>{e.stopPropagation();step(1)};
lb.addEventListener('click',e=>{if(e.target===lb)closeLB()});
addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;
  if(e.key==='Escape')closeLB();if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)});
</script>
</body>
</html>
