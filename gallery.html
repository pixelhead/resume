<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Gabe Torrez — work gallery. Illustration, 3D, motion, and print.">
<title>Gabe Torrez — Work Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#0C0C0E; --bg-2:#141418; --ink:#F4F2ED; --ink-2:#9B988F;
  --line:#26262B; --accent:#D6FF3E;
  --pad:clamp(14px,3.5vw,40px);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
button{font-family:inherit}

/* page title banner */
.pagetitle{max-width:1440px;margin:0 auto;padding:clamp(2rem,5vw,3.5rem) var(--pad) clamp(1rem,2vw,1.5rem)}
.pagetitle h1{font-family:'Anton',sans-serif;text-transform:uppercase;letter-spacing:.01em;
  line-height:.9;font-size:clamp(2.8rem,9vw,6rem)}
.pagetitle h1 span{color:var(--accent)}
.pagetitle p{color:var(--ink-2);font-size:1rem;font-weight:500;margin-top:.8rem;max-width:48ch}

/* top bar */
.bar{position:sticky;top:0;z-index:50;background:rgba(12,12,14,.9);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:.9rem var(--pad)}
.bar-in{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap}
.logo{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:1.15rem;letter-spacing:.02em;
  white-space:nowrap}
.logo span{color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:.5rem;margin-left:auto}
.filter{font-weight:700;font-size:.8rem;padding:.5rem 1rem;border-radius:100px;
  border:1px solid var(--line);color:var(--ink-2);background:transparent;cursor:pointer;transition:.2s}
.filter:hover{color:var(--ink);border-color:#3a3a42}
.filter.active{background:var(--accent);color:#0C0C0E;border-color:var(--accent)}
.filter.home{background:var(--accent);color:#0C0C0E;border-color:var(--accent);text-decoration:none;
  display:inline-flex;align-items:center;margin-left:2.45rem}
.filter.home:hover{color:#0C0C0E;transform:translateY(-1px)}
.bar-link{font-weight:700;font-size:.8rem;color:var(--ink-2);transition:color .2s;text-decoration:none;white-space:nowrap}
.bar-link:hover{color:var(--ink)}

/* GALLERY — CSS grid with explicit tier spans (dense flow fills gaps) */
.gallery{max-width:1440px;margin:0 auto;padding:clamp(1rem,3vw,1.8rem) var(--pad) 4rem;
  display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;grid-auto-rows:220px;grid-auto-flow:dense}
.gitem{border-radius:14px;overflow:hidden;position:relative;cursor:pointer;
  background:var(--bg-2);border:1px solid var(--line);
  transition:transform .25s,border-color .25s}
.gitem:hover{transform:translateY(-4px);border-color:#3a3a42}
.gitem img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.gitem:hover img{transform:scale(1.05)}

/* size tiers — only apply in the "All" view (body.filtered strips them) */
.gitem.hero{grid-column:span 2;grid-row:span 2}
.gitem.wide{grid-column:span 2;grid-row:span 1}
.gitem.tall{grid-column:span 1;grid-row:span 2}
/* std = 1x1 default */

/* when a medium filter is active, everything snaps to uniform 1x1 */
body.filtered .gitem{grid-column:span 1 !important;grid-row:span 1 !important}

.gitem .ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;
  padding:1rem 1.1rem;background:linear-gradient(to top,rgba(12,12,14,.94) 8%,rgba(12,12,14,.08) 55%,transparent);
  opacity:0;transition:opacity .25s}
.gitem:hover .ov{opacity:1}
.gitem .ov .t{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.gitem .ov h4{font-size:1rem;font-weight:700;margin-top:.15rem}
.gitem.hero .ov h4{font-size:1.5rem}
.gitem.wide .ov h4{font-size:1.2rem}
.gitem .ov .desc{color:var(--ink-2);font-size:.82rem;margin-top:.35rem;max-width:42ch;display:none}
/* description only shows on the big tiles, and only in All view */
.gitem.hero .ov .desc,.gitem.wide .ov .desc{display:block}
body.filtered .gitem .ov .desc{display:none}
body.filtered .gitem.hero .ov h4,body.filtered .gitem.wide .ov h4{font-size:1rem}

.gitem .badge{position:absolute;top:.7rem;right:.7rem;width:36px;height:36px;border-radius:50%;
  background:rgba(12,12,14,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;
  font-size:.95rem;opacity:0;transition:opacity .25s;border:1px solid rgba(255,255,255,.18);z-index:2}
.gitem:hover .badge{opacity:1}
.gitem.hide{display:none}
.empty{color:var(--ink-2);text-align:center;padding:4rem 0;font-size:.95rem}

/* lightbox */
.lb{position:fixed;inset:0;z-index:100;background:rgba(8,8,10,.95);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:clamp(1rem,4vw,3rem)}
.lb.open{display:flex}
.lb-inner{max-width:1100px;max-height:90vh;position:relative;display:flex;flex-direction:column;align-items:center}
.lb-inner img,.lb-inner video{max-width:100%;max-height:80vh;border-radius:10px;display:block;background:#000}
.lb-cap{margin-top:1rem;text-align:center}
.lb-cap .t{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.lb-cap h4{font-size:1.1rem;font-weight:700;margin-top:.2rem}
.lb-close{position:absolute;top:-2.6rem;right:0;background:none;border:0;color:var(--ink);
  font-size:1.6rem;cursor:pointer;line-height:1;padding:.3rem}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.08);
  border:1px solid var(--line);color:var(--ink);width:48px;height:48px;border-radius:50%;cursor:pointer;
  font-size:1.3rem;display:flex;align-items:center;justify-content:center;transition:.2s}
.lb-nav:hover{background:var(--accent);color:#0C0C0E;border-color:var(--accent)}
.lb-prev{left:-1rem}.lb-next{right:-1rem}
/* hide arrows when a project has only one media item */
.lb.single .lb-nav{display:none}
/* per-project position counter */
.lb-count{position:absolute;top:-2.55rem;left:0;font-size:.8rem;font-weight:700;
  letter-spacing:.05em;color:var(--ink-2)}
.lb-count b{color:var(--accent);font-weight:700}
/* a link rendered as a slide: poster with an Open button over it */
.lb-linkslide{position:relative;display:inline-block;max-width:100%}
.lb-linkslide img{max-height:80vh}
.lb-open{position:absolute;left:50%;bottom:1.2rem;transform:translateX(-50%);
  display:inline-flex;align-items:center;gap:.45rem;font-weight:700;font-size:.9rem;
  padding:.85rem 1.6rem;border-radius:100px;background:var(--accent);color:#0C0C0E;
  text-decoration:none;transition:transform .2s}
.lb-open:hover{transform:translateX(-50%) translateY(-2px)}

/* count badge on the tile — reuses the badge chip, sits pill-shaped */
.gitem .badge.count{width:auto;min-width:36px;padding:0 .6rem;gap:.2rem;
  font-family:'Manrope',sans-serif;font-weight:700;font-size:.8rem}
.gitem .badge.count svg{width:13px;height:13px;display:block}

@media(max-width:1000px){
  .gallery{grid-template-columns:repeat(2,1fr)}
  .gitem.hero{grid-column:span 2;grid-row:span 2}
  .gitem.wide{grid-column:span 2;grid-row:span 1}
  .gitem.tall{grid-column:span 1;grid-row:span 2}
}
@media(max-width:560px){
  .gallery{grid-template-columns:1fr;grid-auto-rows:200px}
  .gitem.hero,.gitem.wide,.gitem.tall{grid-column:span 1;grid-row:span 1}
  .lb-prev{left:.3rem}.lb-next{right:.3rem}.lb-close{top:-2.4rem}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div class="pagetitle">
  <h1>Work <span>Gallery</span></h1>

<main class="gallery" id="gallery"></main>

/* ---------------------------------------------------------------
   MEDIA NORMALIZER
   Every project ends up with a `media` array of {type,src?,href?,poster?,label?}.
   - If a project already declares `media`, it's used as-is.
   - Otherwise one item is built from the legacy img/src/link fields,
     so all existing projects keep working with zero changes.
   To make a mini-gallery, add a `media` array to that project — e.g.
     media:[
       {type:'image', src:'support_images/spider_1.jpg'},
       {type:'image', src:'support_images/spider_2.jpg'},
       {type:'video', src:'video/spider_turn.mp4'},
       {type:'link',  href:'https://…', poster:'support_images/x.jpg', label:'View 3D model'}
     ]
---------------------------------------------------------------- */
PROJECTS.forEach(p=>{
  if(Array.isArray(p.media)&&p.media.length)return;
  if(p.type==='video')     p.media=[{type:'video', src:p.src, poster:p.img}];
  else if(p.type==='link') p.media=[{type:'link',  href:p.link, poster:p.img, label:'Open ↗'}];
  else                     p.media=[{type:'image', src:p.img}];
});

const gallery=document.getElementById('gallery');
const iconFor=t=>t==='video'?'▶':t==='link'?'↗':'⤢';
/* stacked-frames glyph for multi-item projects, next to the count */
const STACK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><rect x="7" y="7" width="12" height="12" rx="1.5"/><path d="M4 15V5.5A1.5 1.5 0 0 1 5.5 4H15"/></svg>';
function badgeHTML(p){
  const n=p.media.length;
  return n>1
    ? `<span class="badge count">${STACK}${n}</span>`
    : `<span class="badge">${iconFor(p.media[0].type)}</span>`;
}
gallery.innerHTML=PROJECTS.map((p,i)=>`
  <div class="gitem ${p.tier||'std'}" data-cat="${p.cat}" data-i="${i}" role="button" tabindex="0" aria-label="Open ${p.title}">
    <img src="${p.img}" alt="${p.title}" loading="lazy">
    ${badgeHTML(p)}
    <div class="ov">
      <span class="t">${p.tag}</span>
      <h4>${p.title}</h4>
      ${p.desc?`<p class="desc">${p.desc}</p>`:''}
    </div>
  </div>`).join('');

document.getElementById('filters').addEventListener('click',e=>{
  const b=e.target.closest('.filter');if(!b||!b.dataset.filter)return;
  document.querySelectorAll('.filter').forEach(f=>f.classList.remove('active'));
  b.classList.add('active');
  const f=b.dataset.filter;
  // Option A: size hierarchy only in "All". Any medium filter → uniform grid.
  document.body.classList.toggle('filtered',f!=='all');
  document.querySelectorAll('.gitem').forEach(g=>g.classList.toggle('hide',f!=='all'&&g.dataset.cat!==f));
});

const lb=document.getElementById('lb'),lbMedia=document.getElementById('lbMedia'),
  lbTag=document.getElementById('lbTag'),lbTitle=document.getElementById('lbTitle');
/* per-project position counter, e.g. "2 / 4" */
const lbCount=document.createElement('div');lbCount.className='lb-count';lbCount.id='lbCount';
document.querySelector('.lb-inner').appendChild(lbCount);

/* curList is now ONE project's media array; curIdx walks within it and loops */
let curList=[],curIdx=0,curProject=null;
function openLB(i){
  curProject=PROJECTS[i];
  curList=curProject.media;
  if(curList.length===1 && curList[0].type==='link'){
    window.open(curList[0].href,'_blank','noopener');
    return;
  }
  curIdx=0;
  lb.classList.toggle('single',curList.length<2);
  renderLB();
  lb.classList.add('open');
  document.body.style.overflow='hidden';
}
function renderLB(){
  const m=curList[curIdx];
  if(m.type==='video'){
    lbMedia.innerHTML=`<video src="${m.src}"${m.poster?` poster="${m.poster}"`:''} controls autoplay playsinline></video>`;
  }else if(m.type==='link'){
    lbMedia.innerHTML=`<span class="lb-linkslide">
        <img src="${m.poster||curProject.img}" alt="${curProject.title}">
        <a class="lb-open" href="${m.href}" target="_blank" rel="noopener">${m.label||'Open ↗'}</a>
      </span>`;
  }else{
    lbMedia.innerHTML=`<img src="${m.src}" alt="${curProject.title}">`;
  }
  lbTag.textContent=curProject.tag;
  lbTitle.textContent=curProject.title;
  lbCount.innerHTML=curList.length>1?`<b>${curIdx+1}</b> / ${curList.length}`:'';
}
function closeLB(){lb.classList.remove('open');lbMedia.innerHTML='';document.body.style.overflow=''}
/* loop within the project — last → next wraps back to first */
function step(d){if(curList.length<2)return;curIdx=(curIdx+d+curList.length)%curList.length;renderLB()}
gallery.addEventListener('click',e=>{const g=e.target.closest('.gitem');if(g)openLB(+g.dataset.i)});
gallery.addEventListener('keydown',e=>{const g=e.target.closest('.gitem');if(!g)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();openLB(+g.dataset.i)}});
document.getElementById('lbClose').onclick=closeLB;
document.getElementById('lbPrev').onclick=e=>{e.stopPropagation();step(-1)};
document.getElementById('lbNext').onclick=e=>{e.stopPropagation();step(1)};
lb.addEventListener('click',e=>{if(e.target===lb)closeLB()});
addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;
  if(e.key==='Escape')closeLB();if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)});
</script>
</body>
</html>
